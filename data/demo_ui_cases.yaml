# ==============================================================================
# 内置演示 UI 用例（指向 saucedemo.com，Sauce Labs 提供的公开练习站点）
#
# 站点把测试账号直接写在登录页上，账号如下：
#   standard_user      / secret_sauce       正常用户
#   locked_out_user    / secret_sauce       被锁定用户
#   problem_user       / secret_sauce       有缺陷的用户（图片错乱等）
#
# 步骤动作支持：open / click / input / select / hover / press / wait /
#              assert_visible / assert_text / assert_value / assert_url / screenshot
#
# 注意：UI 用例执行前需要安装浏览器内核：playwright install chromium
# ==============================================================================

variables:
  base_url: https://www.saucedemo.com
  standard_user: standard_user
  locked_user: locked_out_user
  password: secret_sauce

cases:
  # ---------------------------------------------------------------------------
  # 1. 登录成功主流程
  # ---------------------------------------------------------------------------
  - id: ui_001
    name: "UI - 标准用户登录成功"
    case_type: ui
    description: "验证标准用户输入正确账号密码后能跳转到商品列表页。"
    tags: ["smoke", "critical"]
    base_url: https://www.saucedemo.com
    steps:
      - action: open
        value: /
        name: "打开登录页"
      - action: assert_visible
        selector: "#login-button"
        name: "登录按钮可见"
      - action: input
        selector: "#user-name"
        value: "{{standard_user}}"
        name: "输入用户名"
      - action: input
        selector: "#password"
        value: "{{password}}"
        name: "输入密码"
      - action: click
        selector: "#login-button"
        name: "点击登录"
      - action: assert_url
        value: "inventory\\.html"
        name: "跳转到商品列表页"
      - action: assert_visible
        selector: ".inventory_list"
        name: "商品列表容器可见"

  # ---------------------------------------------------------------------------
  # 2. 加入购物车
  # ---------------------------------------------------------------------------
  - id: ui_002
    name: "UI - 加入购物车后角标数量正确"
    case_type: ui
    description: "登录后把第一个商品加入购物车，验证购物车角标显示 1。"
    tags: ["smoke"]
    base_url: https://www.saucedemo.com
    steps:
      - action: open
        value: /
        name: "打开登录页"
      - action: input
        selector: "#user-name"
        value: "{{standard_user}}"
        name: "输入用户名"
      - action: input
        selector: "#password"
        value: "{{password}}"
        name: "输入密码"
      - action: click
        selector: "#login-button"
        name: "点击登录"
      - action: assert_visible
        selector: ".inventory_list"
        name: "等待商品列表加载"
      - action: click
        selector: "#add-to-cart-sauce-labs-backpack"
        name: "把背包加入购物车"
      - action: assert_text
        selector: ".shopping_cart_badge"
        value: "1"
        name: "购物车角标显示 1"

  # ---------------------------------------------------------------------------
  # 3. 完整下单流程（端到端）
  # ---------------------------------------------------------------------------
  - id: ui_003
    name: "UI - 完整下单流程（加购 -> 结算 -> 完成）"
    case_type: ui
    description: "端到端验证从登录到下单完成的完整链路，覆盖结算表单填写。"
    tags: ["regression", "critical"]
    base_url: https://www.saucedemo.com
    steps:
      - action: open
        value: /
        name: "打开登录页"
      - action: input
        selector: "#user-name"
        value: "{{standard_user}}"
        name: "输入用户名"
      - action: input
        selector: "#password"
        value: "{{password}}"
        name: "输入密码"
      - action: click
        selector: "#login-button"
        name: "点击登录"
      - action: click
        selector: "#add-to-cart-sauce-labs-backpack"
        name: "加入购物车"
      - action: click
        selector: ".shopping_cart_link"
        name: "打开购物车"
      - action: click
        selector: "#checkout"
        name: "点击结算"
      - action: input
        selector: "#first-name"
        value: Auto
        name: "填写名"
      - action: input
        selector: "#last-name"
        value: Tester
        name: "填写姓"
      - action: input
        selector: "#postal-code"
        value: "200000"
        name: "填写邮编"
      - action: click
        selector: "#continue"
        name: "继续"
      - action: click
        selector: "#finish"
        name: "提交订单"
      - action: assert_text
        selector: ".complete-header"
        value: Thank you for your order
        name: "下单成功提示"

  # ---------------------------------------------------------------------------
  # 4. 登录失败：密码错误
  # ---------------------------------------------------------------------------
  - id: ui_004
    name: "UI - 密码错误时提示信息正确"
    case_type: ui
    description: "反向用例：验证错误密码会停留在登录页并给出明确错误提示。"
    tags: ["regression"]
    base_url: https://www.saucedemo.com
    steps:
      - action: open
        value: /
        name: "打开登录页"
      - action: input
        selector: "#user-name"
        value: "{{standard_user}}"
        name: "输入用户名"
      - action: input
        selector: "#password"
        value: wrong_password
        name: "输入错误密码"
      - action: click
        selector: "#login-button"
        name: "点击登录"
      - action: assert_visible
        selector: "h3[data-test='error']"
        name: "错误提示可见"
      - action: assert_text
        selector: "h3[data-test='error']"
        value: do not match
        name: "错误提示文案包含关键字"

  # ---------------------------------------------------------------------------
  # 5. 登录失败：账号被锁定
  # ---------------------------------------------------------------------------
  - id: ui_005
    name: "UI - 锁定账号登录被拒绝"
    case_type: ui
    description: "反向用例：被锁定的账号即使密码正确也应被拒绝登录。"
    tags: ["regression"]
    base_url: https://www.saucedemo.com
    steps:
      - action: open
        value: /
        name: "打开登录页"
      - action: input
        selector: "#user-name"
        value: "{{locked_user}}"
        name: "输入被锁定账号"
      - action: input
        selector: "#password"
        value: "{{password}}"
        name: "输入密码"
      - action: click
        selector: "#login-button"
        name: "点击登录"
      - action: assert_text
        selector: "h3[data-test='error']"
        value: locked out
        name: "提示账号已被锁定"
